services:
  app:
    build:
      context: .
      dockerfile: dockerfile
    ports:
      - "5500:8000"
    env_file: .env
    environment:
      # Keep the SQLite file in a bind-mounted directory. Mounting the single
      # db file instead would leave the WAL sidecars (-wal/-shm) inside the
      # container, and docker creates a directory when the file is missing.
      SQLITE_PATH: /data/bujo_digitizer.sqlite3
    volumes:
      - ${DOCKER_DATA_DIR:-./data}:/data
    restart: always
