{% if not data %}
<p>No entries found.</p>
{% else %}
	{% for group in data %}
		<p class="time-label">{{ group.time or "unknown" }}</p>
		{% for entry in group.bujos %}
		<div class="bujo-entry">
			<span class="type">{{ entry.type.value }}</span>
			<div class="note">{{ entry.note }}</div>
		</div>
		{% endfor %}
	{% endfor %}
{% endif %}
