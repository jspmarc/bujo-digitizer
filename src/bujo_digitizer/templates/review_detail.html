<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Review {{ id }}</title>
	<script src="https://unpkg.com/htmx.org@2"></script>
	<script src="/static/bbox.js" defer></script>
	<style>
		html, body {
			height: 100%;
			margin: 0;
			overflow: hidden;
		}

		body {
			display: flex;
			flex-direction: column;
			justify-content: start;
			align-items: center;
		}

		button,
		.button {
			display: inline-block;
			vertical-align: middle;
			font: inherit;
			padding: .5rem .75rem;
			background: #6b7280;
			color: #fff;
			border: none;
			text-decoration: none;
		}

		.main {
			display: flex;
			flex-direction: row;
			flex-grow: 1;
			justify-content: center;
			align-items: start;
			gap: 1%;
			min-height: 0;
			max-height: 95vh;
			max-width: 85vw;
			margin: 0;
			width: 100vw;
			padding-bottom: 4rem;
		}

		.page {
			position: relative;
			display: inline-block;
			margin: 0;
		}

		.page img {
			max-width: 100%;
			display: block;
		}

		.page, .page img, .main form {
			max-height: 90vh;
		}

		.main form {
			flex: 1 1 30vw;
			gap: 0.5%;
			min-width: 0;
			height: 100%;
			display: flex;
			flex-direction: column;
		}

		.button-group {
			display: flex;
			flex-direction: row;
			justify-content: center;
			align-items: center;
			gap: 1%;
		}

		.parse-result {
			width: 100%;
			box-sizing: border-box;
		}

		.fill-parent {
			width: 100%;
			height: 100%;
			box-sizing: border-box;
			resize: none;
		}

		.page .overlay {
			position: absolute;
			inset: 0;
			pointer-events: none;
		}

		.bbox {
			position: absolute;
			pointer-events: auto;
			border: 1px solid #4f46e5;
			background: rgba(79, 70, 229, .08);
		}

		.bbox-label {
			display: none;
			font-size: .625rem;
			background: #4f46e5;
			color: #fff;
			padding: 0 .25rem;
			white-space: nowrap;
		}

		.bbox:hover {
			background: rgba(255, 165, 0, .8);
		}

		.bbox:hover .bbox-label {
			display: block;
		}
	</style>
</head>

<body>
	<h1>Review {{ id }}</h1>
	<div class="main" hx-get="/reviews/{{ id }}/content" hx-trigger="load"></div>
	<script>
		document.body.addEventListener("htmx:afterSwap", (event) => {
			for (const image of event.detail.elt.querySelectorAll(".page-image")) {
				const overlay = image.parentElement.querySelector(".overlay");
				const draw = () => renderBoundingBoxes(overlay, image, overlay);
				if (image.complete && image.naturalWidth > 0) draw();
				else image.addEventListener("load", draw, {once: true});
			}
		});
	</script>
</body>

</html>
